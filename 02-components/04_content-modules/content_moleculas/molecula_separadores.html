<!-- SEPARADORES POR TAMAÑO -->

<!-- Divs vacíos que solo aportan una altura fija entre bloques (clases definidas en
     global-styles.html). No confundir con "molecula_separador_s.html": esa es una línea
     decorativa (role="molecula-separador"), no un espaciador. -->

<!-- SEPARADOR L (sin sufijo) — 16px — entre secciones/módulos completos, ej. entre el banner y el CTA, o entre el CTA y el wrapper de contenido -->
<div class="separador"></div>

<!-- SEPARADOR M — 10px — entre moléculas dentro de un mismo módulo con más aire, ej. Módulo 1 columna -->
<div class="separador-M"></div>

<!-- SEPARADOR S — 4px — separación mínima entre moléculas de una misma celda, ej. Beneficios, Bullet numerado/icono, Tags, Logos -->
<div class="separador-S"></div>
