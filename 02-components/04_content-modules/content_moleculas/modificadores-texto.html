<h1 style="color:{{color_texto_mail_general}}; margin:0; font-weight: bold;">Texto h1</h1>

<!-- ITALIC: SE AGREGA "font-style: italic;" en el style  -->

<h1 style="color:{{color_texto_mail_general}}; margin:0; font-style: italic; ">Texto h1</h1>

<!-- TACHADO: SE AGREGA "text-decoration: line-through;" en el style  -->

<h1 style="color:{{color_texto_mail_general}}; margin:0; text-decoration: line-through; ">Texto h1</h1>

<!-- SUBRAYADO: SE AGREGA "text-decoration: underline;" en el style  -->

<h1 style="color:{{color_texto_mail_general}}; margin:0; text-decoration: underline;">Texto h1</h1>

<!-- SUPERINDICE: SE AGREGA el texto dentro de la etiqueta <sup>  -->

<h1 style="color:{{color_texto_mail_general}}; margin:0; ">SI<sup>***</sup></h1>
